server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: carrypick-api
  datasource:
    url: jdbc:h2:mem:carrypick;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
  jwt:
    secret: ${JWT_SECRET:carrypick-dev-secret-change-me-0123456789abcdef}
    ttl-hours: 72
  upload-dir: ${UPLOAD_DIR:uploads}
  seed-demo-data: true
  pricing:
    fee-rate: 0.10
    tax-threshold-krw: 150000
    tax-rate: 0.10
    # A reward can be at most this share of the item price (0.5 = 50%).
    max-reward-rate: 0.5
  payment:
    mode: ${PAYMENT_MODE:mock}
    toss-client-key: ${TOSS_CLIENT_KEY:}
    toss-secret-key: ${TOSS_SECRET_KEY:}
    toss-confirm-url: https://api.tosspayments.com/v1/payments/confirm
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-haiku-5-5}
    api-url: https://api.anthropic.com/v1/messages
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    gemini-api-url: https://generativelanguage.googleapis.com/v1beta/models
  fx:
    KRW: 1
    JPY: 9.2
    USD: 1380
    EUR: 1500
    GBP: 1750
    THB: 40
    VND: 0.055
    IDR: 0.085
    TWD: 43
    CNY: 190
    HKD: 177
    SGD: 1030

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carrypick}
    username: ${DB_USER:carrypick}
    password: ${DB_PASSWORD:carrypick}
  jpa:
    hibernate:
      ddl-auto: update
